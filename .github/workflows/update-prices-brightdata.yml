name: Actualizar precios via Bright Data

# Dispara el collector "mercadolibre.com.ar" de Bright Data con las URLs del
# catalogo, espera el resultado y abre un PR con los cambios de precio.
# Nada se publica sin que Juan revise y le de merge al PR.
#
# Reemplaza a update-prices.yml (pausado): la API oficial de ML sigue
# bloqueada (401) y el scraper Puppeteer propio choca con el antibot de ML.
# Ver MISTAKES.md / memoria del proyecto (2026-07-06/07).
#
# Requisito: secret BRIGHTDATA_API_TOKEN (Settings > Secrets and variables > Actions).

on:
  schedule:
    # Lunes, miércoles y viernes 12:00 UTC = 09:00 hora Argentina (UTC-3),
    # una hora despues de que corre el collector propio en Bright Data
    # (lun/mie/vie 09:00 ART) para no pisarle la corrida con un trigger
    # nuestro al mismo tiempo.
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch: {} # botón para correrlo a mano desde la pestaña Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Armar la lista de URLs desde el catalogo
        run: |
          node -e "
          const fs = require('fs');
          const src = fs.readFileSync('src/data/curated-products.ts', 'utf8');
          const blocks = src.split(/\n  \{\n/).slice(1);
          function get(block, prop) {
            const m = block.match(new RegExp('(?:^|\\\\n)\\\\s*' + prop + ':\\\\s*[\\'\"\`]([^\\'\"\`]*)[\\'\"\`]'));
            return m ? m[1] : '';
          }
          const urls = blocks.map((b) => get(b, 'permalink')).filter(Boolean);
          fs.writeFileSync('/tmp/trigger-body.json', JSON.stringify(urls.map((url) => ({ url }))));
          console.log(urls.length + ' URLs');
          "

      - name: Disparar el collector en Bright Data
        env:
          TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          set -e
          status=$(curl -s -o /tmp/trigger.json -w "%{http_code}" \
            -X POST "https://api.brightdata.com/dca/trigger?collector=c_mrbcvyc91n9lmqv6dt" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/trigger-body.json)
          if [ "$status" != "200" ]; then
            echo "Trigger fallo (HTTP $status):"
            cat /tmp/trigger.json
            exit 1
          fi
          collection_id=$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/trigger.json','utf8')).collection_id || ''")
          if [ -z "$collection_id" ]; then
            echo "Sin collection_id en la respuesta:"
            cat /tmp/trigger.json
            exit 1
          fi
          echo "collection_id=$collection_id" >> "$GITHUB_ENV"
          echo "Disparado: $collection_id"

      - name: Esperar el dataset (hasta ~25 min)
        env:
          TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          for i in $(seq 1 100); do
            status=$(curl -s -o /tmp/dataset.json -w "%{http_code}" \
              "https://api.brightdata.com/dca/dataset?id=$collection_id" \
              -H "Authorization: Bearer $TOKEN")
            if [ "$status" = "200" ]; then
              echo "Listo despues de $((i * 15))s aprox."
              exit 0
            fi
            sleep 15
          done
          echo "Se agoto la espera del dataset."
          exit 1

      - name: Aplicar precios al catalogo
        run: node scripts/apply-brightdata-prices.cjs /tmp/dataset.json --apply

      - name: Abrir Pull Request si hubo cambios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if git diff --quiet -- src/data/curated-products.ts; then
            echo "Sin cambios de precio. No se abre PR."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          BRANCH="precios/brightdata-${DATE}-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/curated-products.ts
          git commit -m "chore(precios): actualizacion via Bright Data ${DATE}"
          git push origin "$BRANCH"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Precios ML (Bright Data) — ${DATE} (revisar antes de publicar)" \
            --body "Actualización automática de precios desde MercadoLibre (via Bright Data).

          Revisá el diff de \`src/data/curated-products.ts\`. Los cambios sospechosos
          (precio se duplicó o cayó a menos de la mitad) quedaron afuera a propósito,
          ver el log del job \"Aplicar precios al catalogo\" para esos casos.
          Si el resto tiene sentido, hacé merge y Vercel publica solo.

          Generado por el workflow .github/workflows/update-prices-brightdata.yml"
