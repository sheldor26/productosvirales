name: TEMP - test Bright Data API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar corrida chica (2 URLs) via /dca/trigger
        env:
          TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          echo "--- POST /dca/trigger?collector=c_mrbcvyc91n9lmqv6dt ---"
          curl -s -o /tmp/trigger.json -w "HTTP_STATUS:%{http_code}\n" \
            -X POST \
            "https://api.brightdata.com/dca/trigger?collector=c_mrbcvyc91n9lmqv6dt" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '[{"url":"https://www.mercadolibre.com.ar/p/MLA63267892"},{"url":"https://www.mercadolibre.com.ar/p/MLA43961816"}]'
          echo "--- respuesta ---"
          cat /tmp/trigger.json
          echo ""
          echo "collection_id=$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/trigger.json','utf8')).collection_id || ''")" >> "$GITHUB_ENV"

      - name: Poll /dca/dataset hasta que este listo (maximo ~3 min)
        env:
          TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          echo "collection_id capturado: $collection_id"
          if [ -z "$collection_id" ]; then
            echo "No se obtuvo collection_id, no se puede pollear."
            exit 0
          fi
          for i in $(seq 1 18); do
            echo "--- intento $i ---"
            status=$(curl -s -o /tmp/poll.json -w "%{http_code}" \
              "https://api.brightdata.com/dca/dataset?id=$collection_id" \
              -H "Authorization: Bearer $TOKEN")
            echo "HTTP_STATUS:$status"
            head -c 1000 /tmp/poll.json
            echo ""
            if [ "$status" = "200" ]; then
              echo "LISTO"
              break
            fi
            sleep 10
          done
