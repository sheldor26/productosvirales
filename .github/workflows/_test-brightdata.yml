name: TEMP - test Bright Data API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar endpoint legacy con el ID de run real (j_...)
        env:
          TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          echo "--- Legacy: /dca/dataset?id=j_mrbd5syz2b3x4f4la2 ---"
          curl -s -o /tmp/legacy.json -w "HTTP_STATUS:%{http_code}\n" \
            "https://api.brightdata.com/dca/dataset?id=j_mrbd5syz2b3x4f4la2" \
            -H "Authorization: Bearer $TOKEN"
          echo "--- primeras 500 chars ---"
          head -c 500 /tmp/legacy.json
          echo ""

      - name: Probar listado de corridas del collector
        env:
          TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          for path in \
            "https://api.brightdata.com/dca/get_collections?collector=c_mrbcvyc91n9lmqv6dt" \
            "https://api.brightdata.com/dca/collections?collector=c_mrbcvyc91n9lmqv6dt" \
            "https://api.brightdata.com/datasets/list"; do
            echo "--- $path ---"
            curl -s -o /tmp/x.json -w "HTTP_STATUS:%{http_code}\n" "$path" -H "Authorization: Bearer $TOKEN"
            head -c 500 /tmp/x.json
            echo ""
          done

      - name: Probar endpoint nuevo - snapshots por dataset_id
        env:
          TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          echo "--- Nuevo: /datasets/v3/snapshots?dataset_id=c_mrbcvyc91n9lmqv6dt ---"
          curl -s -o /tmp/v3.json -w "HTTP_STATUS:%{http_code}\n" \
            "https://api.brightdata.com/datasets/v3/snapshots?dataset_id=c_mrbcvyc91n9lmqv6dt&status=ready&limit=5" \
            -H "Authorization: Bearer $TOKEN"
          echo "--- primeras 800 chars ---"
          head -c 800 /tmp/v3.json
          echo ""
