<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; font-family:'Arial', 'Helvetica Neue', sans-serif; overflow:hidden; }

  .canvas {
    width:1080px; height:1350px; position:relative;
    background: linear-gradient(160deg, #EFE6FF 0%, #F9EEFA 35%, #FFEDE4 100%);
    overflow:hidden;
  }

  .spark { position:absolute; color:#f4b5a4; z-index:1; opacity:0.7; }

  .topbar {
    position:absolute; top:0; left:0; width:1080px; height:180px;
    background:#fff;
    box-shadow: 0 4px 0 rgba(184,169,212,0.25);
    display:flex; align-items:center;
    padding: 0 56px;
    z-index:3;
  }
  .wordmark { display:flex; flex-direction:column; }
  .wordmark .row { display:flex; align-items:center; gap:4px; }
  .wordmark .productos { font-size:54px; font-weight:800; letter-spacing:-1px; color:#b8a9d4; }
  .wordmark .virales {
    font-size:54px; font-weight:800; letter-spacing:-1px; color:#fff;
    background: linear-gradient(120deg, #f4b5a4, #ef8f76); padding:2px 22px; border-radius:14px; position:relative;
  }
  .wordmark .virales svg { position:absolute; top:-4px; right:-10px; width:26px; height:26px; }
  .wordmark .tagline { font-size:24px; color:#f4b5a4; font-style:italic; margin-top:2px; margin-left:2px; font-weight:600; }

  /* product strip: thumb + title, keeps this slide self-contained if seen alone */
  .product-strip {
    position:absolute; top:212px; left:56px; width:968px; height:118px; z-index:3;
    display:flex; align-items:center; gap:26px;
    background:#fff; border-radius:28px; padding:0 30px;
    box-shadow: 0 14px 30px rgba(184,169,212,0.3);
  }
  .product-strip .thumb {
    flex-shrink:0; width:86px; height:86px; border-radius:18px; background:#f5f2fb;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .product-strip .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .product-strip .name {
    flex:1 1 auto; min-width:0;
    font-size:31px; font-weight:800; color:#1a1a2e; line-height:1.2;
    max-height:2.5em; overflow:hidden; word-break:break-word; overflow-wrap:anywhere;
  }

  .heading {
    position:absolute; top:390px; left:56px; width:968px; z-index:3;
    font-size:58px; font-weight:900; color:#1a1a2e; text-align:center;
  }
  .heading .accent { color:#ef8f76; }

  .grid {
    position:absolute; top:500px; left:56px; width:968px; height:640px; z-index:3;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:26px;
  }
  .tile {
    background:#fff; border-radius:32px; padding:40px 34px;
    box-shadow: 0 16px 32px rgba(184,169,212,0.28);
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start;
    overflow:hidden;
  }
  .tile .icon {
    width:74px; height:74px; border-radius:50%; flex-shrink:0;
    background:#f5f2fb;
    display:flex; align-items:center; justify-content:center;
    font-size:36px; margin-bottom:18px;
  }
  .tile .tile-title {
    flex-shrink:0;
    font-size:32px; font-weight:800; color:#1a1a2e; line-height:1.18; margin-bottom:8px;
    max-height:2.36em; overflow:hidden; word-break:break-word; overflow-wrap:anywhere;
  }
  .tile .tile-desc {
    flex-shrink:0;
    font-size:23px; font-weight:600; color:#777; line-height:1.28;
    max-height:2.56em; overflow:hidden; word-break:break-word; overflow-wrap:anywhere;
  }

  .footer-row {
    position:absolute; bottom:36px; right:56px; z-index:3;
    display:flex; align-items:center; justify-content:flex-end;
  }
  .ml-badge {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fff; border-radius:20px; padding:6px 20px 9px;
    box-shadow: 0 10px 26px rgba(184,169,212,0.4), 0 0 0 3px #F2ECFF;
  }
  .ml-badge .label { font-size:15px; font-weight:700; color:#999; margin-bottom:1px; }
  .ml-logo { height:58px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="spark" style="top:150px; left:600px; font-size:40px;">&#10022;</div>
    <div class="spark" style="top:1220px; left:60px; font-size:28px;">&#10022;</div>
    <div class="spark" style="top:1180px; left:940px; font-size:22px;">&#10022;</div>

    <div class="topbar">
      <div class="wordmark">
        <div class="row">
          <span class="productos">productos</span>
          <span class="virales">virales
            <svg viewBox="0 0 12 12" fill="none">
              <path d="M2 9L6 5L8 7L11 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 3H11V6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <div class="tagline">productosvirales.com.ar</div>
      </div>
    </div>

    <div class="product-strip">
      <div class="thumb"><img src="__IMG_URL__" onerror="this.style.display='none';" /></div>
      <div class="name">__TITLE__</div>
    </div>

    <div class="heading">Lo que tenés <span class="accent">que saber</span></div>

    <div class="grid">
      <div class="tile">
        <div class="icon">__ICON_1__</div>
        <div class="tile-title">__BENEFIT_TITLE_1__</div>
        <div class="tile-desc">__BENEFIT_DESC_1__</div>
      </div>
      <div class="tile">
        <div class="icon">__ICON_2__</div>
        <div class="tile-title">__BENEFIT_TITLE_2__</div>
        <div class="tile-desc">__BENEFIT_DESC_2__</div>
      </div>
      <div class="tile">
        <div class="icon">__ICON_3__</div>
        <div class="tile-title">__BENEFIT_TITLE_3__</div>
        <div class="tile-desc">__BENEFIT_DESC_3__</div>
      </div>
      <div class="tile">
        <div class="icon">__ICON_4__</div>
        <div class="tile-title">__BENEFIT_TITLE_4__</div>
        <div class="tile-desc">__BENEFIT_DESC_4__</div>
      </div>
    </div>

    <div class="footer-row">
      <div class="ml-badge">
        <span class="label">Disponible en</span>
        <img class="ml-logo" src="__ML_LOGO__" />
      </div>
    </div>
  </div>
</body>
</html>
