<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; font-family:'Arial', 'Helvetica Neue', sans-serif; overflow:hidden; }

  /* Cuadrado 1:1 — WhatsApp no recorta esta proporción ni en chat ni en Estados
     (a diferencia del 4:5 del post de Threads/IG, que en Estados (9:16) queda
     con el wordmark de arriba cortado). Todo el contenido se ajustó a esta
     altura, no es el template 1080x1350 reescalado. */
  .canvas {
    width:1080px; height:1080px; position:relative;
    background: linear-gradient(160deg, #EFE6FF 0%, #F9EEFA 35%, #FFEDE4 100%);
    overflow:hidden;
  }

  .spark { position:absolute; color:#f4b5a4; z-index:1; opacity:0.7; }

  .topbar {
    position:absolute; top:0; left:0; width:1080px; height:140px;
    background:#fff;
    box-shadow: 0 4px 0 rgba(184,169,212,0.25);
    display:flex; align-items:center;
    padding: 0 50px;
    z-index:3;
  }
  .wordmark { display:flex; flex-direction:column; }
  .wordmark .row { display:flex; align-items:center; gap:4px; }
  .wordmark .productos { font-size:44px; font-weight:800; letter-spacing:-1px; color:#b8a9d4; }
  .wordmark .virales {
    font-size:44px; font-weight:800; letter-spacing:-1px; color:#fff;
    background: linear-gradient(120deg, #f4b5a4, #ef8f76); padding:2px 18px; border-radius:12px; position:relative;
  }
  .wordmark .virales svg { position:absolute; top:-3px; right:-9px; width:22px; height:22px; }
  .wordmark .tagline { font-size:20px; color:#f4b5a4; font-style:italic; margin-top:2px; margin-left:2px; font-weight:600; }

  .photo-frame {
    position:absolute; top:164px; left:60px; width:960px; height:320px;
    background:#fff; border-radius:28px; z-index:2;
    box-shadow: 0 18px 34px rgba(184,169,212,0.35);
    border: 3px solid #fff;
    display:flex; align-items:center; justify-content:center;
    padding:26px;
  }
  .photo-frame img { max-width:100%; max-height:100%; object-fit:contain; }
  .photo-frame .img-fallback {
    display:none; color:#b8a9d4; font-size:24px; font-weight:700; text-align:center;
  }

  .off-badge {
    position:absolute; top:112px; right:34px; z-index:6;
    width:172px; height:172px; border-radius:50%;
    background: linear-gradient(135deg, #ff9d82 0%, #ef6f4f 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: 0 12px 24px rgba(239,111,79,0.55), 0 0 0 8px rgba(244,181,164,0.35);
    transform: rotate(9deg);
    border: 6px solid #fff;
  }
  .off-badge .pct { font-size:50px; font-weight:900; line-height:1; }
  .off-badge .lbl { font-size:22px; font-weight:800; letter-spacing:1.5px; }

  .stock-pill {
    position:absolute; top:190px; left:88px; z-index:6;
    background:#2d2540; color:#fff; font-weight:800; font-size:22px;
    padding:11px 24px; border-radius:12px;
    box-shadow: 0 6px 14px rgba(45,37,64,0.3);
    border: 3px solid #fff;
    max-width:380px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .card {
    position:absolute; bottom:0; left:0; width:1080px; height:596px;
    background:#fff; border-radius:44px 44px 0 0; z-index:5;
    box-shadow: 0 -12px 28px rgba(184,169,212,0.18);
    display:flex; flex-direction:column;
    padding: 40px 50px 26px 50px;
    overflow:hidden;
  }
  .title {
    flex-shrink:0;
    font-size:44px; font-weight:800; color:#1a1a2e; line-height:1.24;
    margin-bottom:14px;
    max-height:2.55em; overflow:hidden;
    word-break:break-word; overflow-wrap:anywhere;
  }
  .brand-row { flex-shrink:0; display:flex; align-items:center; gap:10px; margin-bottom:12px; min-width:0; }
  .brand-tag {
    font-size:30px; font-weight:700; color:#444;
    max-width:660px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .check { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:#b8a9d4; color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; }

  .rating-row { flex-shrink:0; display:flex; align-items:center; gap:10px; margin-bottom:16px; font-size:30px; color:#555; }
  .star { color:#ef8f76; font-size:30px; }

  .price-row { flex-shrink:0; display:flex; align-items:baseline; gap:20px; margin-bottom:16px; flex-wrap:wrap; }
  .old-price { font-size:30px; color:#999; text-decoration:line-through; }
  .new-price { font-size:70px; font-weight:900; color:#1a1a2e; letter-spacing:-1px; }

  .save-pill {
    flex-shrink:0;
    display:inline-flex; align-items:center; gap:12px; align-self:flex-start;
    background: linear-gradient(120deg, #f4b5a4, #ef8f76); color:#fff; font-weight:800; font-size:28px;
    padding:12px 26px; border-radius:14px; margin-bottom:16px;
    box-shadow: 0 8px 16px rgba(239,143,118,0.4);
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .footer-row { flex-shrink:0; margin-top:auto; display:flex; align-items:center; justify-content:flex-end; }
  .site-badge {
    display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
    background:#fff; border-radius:18px; padding:10px 24px;
    box-shadow: 0 8px 22px rgba(184,169,212,0.4), 0 0 0 3px #F2ECFF;
  }
  .site-badge .label { font-size:15px; font-weight:700; color:#999; margin-bottom:2px; }
  .site-badge .url { font-size:24px; font-weight:800; color:#ef8f76; letter-spacing:-0.3px; }

  .canvas.no-discount .off-badge,
  .canvas.no-discount .old-price,
  .canvas.no-discount .save-pill {
    display: none;
  }
  .canvas.no-discount .new-price { font-size:82px; }
  .canvas.no-discount .price-row { margin-bottom:26px; }
</style>
</head>
<body>
  <div class="canvas __CANVAS_CLASS__">
    <div class="spark" style="top:120px; left:600px; font-size:34px;">&#10022;</div>
    <div class="spark" style="top:560px; left:30px; font-size:24px;">&#10022;</div>
    <div class="spark" style="top:105px; left:850px; font-size:18px;">&#10022;</div>

    <div class="topbar">
      <div class="wordmark">
        <div class="row">
          <span class="productos">productos</span>
          <span class="virales">virales
            <svg viewBox="0 0 12 12" fill="none">
              <path d="M2 9L6 5L8 7L11 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 3H11V6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <div class="tagline">productosvirales.com.ar</div>
      </div>
    </div>

    <div class="photo-frame">
      <img src="__IMG_URL__" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
      <div class="img-fallback">Foto no disponible</div>
    </div>
    <div class="stock-pill">__BADGE__</div>
    <div class="off-badge"><span class="pct">-__OFF_PCT__%</span><span class="lbl">OFF</span></div>

    <div class="card">
      <div class="title">__TITLE__</div>
      <div class="brand-row">
        <span class="brand-tag">__BRAND__</span>
        <span class="check">&#10003;</span>
      </div>
      <div class="rating-row">
        <span class="star">&#9733;</span>
        <span>__RATING__ | __SOLD__</span>
      </div>
      <div class="price-row">
        <span class="old-price">$ __OLD_PRICE__</span>
        <span class="new-price">$ __NEW_PRICE__</span>
      </div>
      <div class="save-pill">&#128176; Ahorrás $ __SAVINGS__</div>
      <div class="footer-row">
        <div class="site-badge">
          <span class="label">Nuestras ofertas diarias</span>
          <span class="url">productosvirales.com.ar/enlaces</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
